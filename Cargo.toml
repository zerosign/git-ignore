[package]
name = "git-ignore"
version = "0.0.1"
edition = "2024"
license = "MIT"

[dependencies]
argh = "0.1"
dirs = "6.0"
gix = { version = "0.83", default-features = false, features = ["blocking-network-client", "worktree-mutation", "zlib-rs", "sha1", "sha256", "interrupt", "revision", "blob-diff"] }
thiserror = "2.0"
redb = "4.1"
fst = "0.4"
tempfile = "3.10"
sha2 = "0.10"
build-info = "0.0.39"
mimalloc = { version = "0.1", default-features = false }
similar = "3.1.1"

[build-dependencies]
build-info-build = "0.0.39"

[dev-dependencies]
libc = "0.2.186"
nix = { version = "0.31.3", features = ["ptrace", "process", "signal"] }
os_pipe = "1.1"
syscalls = "0.8.1"

[features]
default = ["debug-tls"]
# Production performance: enables aws-lc-rs and high-performance git features
performance = ["gix/max-performance-safe", "gix/blocking-http-transport-reqwest-rust-tls-trust-dns"]
# Debug friendly: uses native-tls to avoid aws-lc-rs/mold linker issues
debug-tls = ["gix/blocking-http-transport-reqwest-native-tls"]

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.{ archive-format }"
bin-dir = "{ bin }{ format }"
pkg-fmt = "tgz"
[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

