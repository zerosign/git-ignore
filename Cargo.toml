[package]
name = "git-ignore"
version = "0.0.4"
edition = "2024"
license = "MIT"

[dependencies]
dirs = "6.0"
gix = { version = "0.87", default-features = false, features = ["blocking-network-client", "worktree-mutation", "sha1", "sha256", "interrupt", "revision", "blob-diff"] }
thiserror = "2.0"
redb = "4.1"
tempfile = "3.10"
sha2 = "0.11"
rkyv = "0.8.18"
usage-rs = { version = "7.1.3", default-features = false, features = ["help", "diagnostics", "completions"] }
memmap2 = "0.9.12"

[build-dependencies]
vergen-gix = { version = "10.0", features = ["build", "cargo"] }

[dev-dependencies]
libc = "0.2.186"

[features]
default = ["debug-tls"]
# Production performance: enables aws-lc-rs and high-performance git features
performance = ["gix/max-performance-safe", "gix/blocking-http-transport-reqwest-rust-tls-trust-dns"]
# Debug friendly: uses native-tls to avoid aws-lc-rs/mold linker issues
debug-tls = ["gix/blocking-http-transport-reqwest-native-tls"]

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.{ archive-format }"
bin-dir = "{ bin }{ format }"
pkg-fmt = "tgz"
[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

