name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check-semver:
    name: Check SemVer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check semver
        uses: obi1kenobi/cargo-semver-checks-action@v2

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install just
        uses: extractions/setup-just@v2
      - name: Run tests
        run: just test
